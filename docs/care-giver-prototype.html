// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

Object.assign(window, {

                border: `1px solid oklch(90% 0.06 25)`,
              }}>
                <span style={{ fontSize: 16 }}>{meta(item).icon}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: C.textPrimary, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.name}</div>
                  <div style={{ fontSize: 11, color: C.textMuted }}>Due {timeLabel(item.dueTime)}</div>
                </div>
                <button onClick={() => setConfirmItem(item)} style={{
                  background: C.danger, color: '#fff', border: 'none', borderRadius: 6,
                  fontSize: 11, fontWeight: 600, padding: '5px 10px', cursor: 'pointer', whiteSpace: 'nowrap',
                }}>Done</button>
              </div>
            ))}
          </div>
        )}

        {/* Timeline */}
        <div style={{ padding: '0 12px' }}>
          {[...done, ...upcoming].sort((a, b) => a.dueTime.localeCompare(b.dueTime)).map((item, idx, arr) => {
            const isDone = item.status === 'completed';
            const isUpcoming = item.status === 'upcoming';
            const m = meta(item);
            return (
              <div key={item.id} style={{ display: 'flex', gap: 10, marginBottom: 2 }}>
                {/* Timeline spine */}
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', paddingTop: 12 }}>
                  <div style={{
                    width: 8, height: 8, borderRadius: '50%', flexShrink: 0,
                    background: isDone ? C.success : C.border,
                    border: `2px solid ${isDone ? C.success : C.border}`,
                  }}></div>
                  {idx < arr.length - 1 && (
                    <div style={{ width: 1, flex: 1, background: C.border, minHeight: 16, marginTop: 2 }}></div>
                  )}
                </div>
                {/* Card */}
                <div style={{
                  flex: 1, background: '#fff', borderRadius: 10,
                  padding: '10px 12px', marginBottom: 8,
                  opacity: isDone ? 0.75 : 1,
                  border: `1px solid ${C.border}`,
                  boxShadow: isUpcoming ? '0 1px 4px oklch(0% 0 0 / 0.04)' : 'none',
                }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontSize: 18, lineHeight: 1 }}>{m.icon}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                        <span style={{ fontSize: 13, fontWeight: 600, color: isDone ? C.textSecondary : C.textPrimary }}>{item.name}</span>
                        {isDone && <StatusBadge status="completed" />}
                      </div>
                      <div style={{ fontSize: 11, color: C.textMuted, marginTop: 1 }}>
                        {timeLabel(item.dueTime)}
                        {item.carer && ` · ${item.carer}`}
                      </div>
                      {item.notes && <div style={{ fontSize: 11, color: C.textSecondary, marginTop: 3, fontStyle: 'italic' }}>{item.notes}</div>}
                    </div>
                    {isUpcoming && item.type === 'feeding' && (
                      <button onClick={() => onNavigate && onNavigate('feed')} style={{
                        background: C.accent, color: '#fff', border: 'none', borderRadius: 6,
                        fontSize: 11, fontWeight: 600, padding: '5px 9px', cursor: 'pointer',
                      }}>Start</button>
                    )}
                    {isUpcoming && item.type !== 'feeding' && (
                      <button onClick={() => setConfirmItem(item)} style={{
                        background: C.accentBg, color: C.accent, border: `1px solid ${C.accent}`,
                        borderRadius: 6, fontSize: 11, fontWeight: 600, padding: '5px 9px', cursor: 'pointer',
                      }}>Done</button>
                    )}
                  </div>
                  {item.bulkConfirmed && (
                    <div style={{ marginTop: 5, fontSize: 10, color: C.textMuted, display: 'flex', alignItems: 'center', gap: 4 }}>
                      <span style={{ width: 6, height: 6, borderRadius: '50%', background: C.textMuted, display: 'inline-block' }}></span>
                      Bulk confirmed
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Confirm modal */}
      {confirmItem && (
        <div style={{
          position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.45)',
          display: 'flex', alignItems: 'flex-end', zIndex: 100,
        }}>
          <div style={{
            background: '#fff', borderRadius: '16px 16px 0 0',
            padding: '20px 20px 32px', width: '100%',
          }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: C.textPrimary, marginBottom: 4 }}>
              Mark as done
            </div>
            <div style={{ fontSize: 13, color: C.textSecondary, marginBottom: 16 }}>
              {confirmItem.name} · {timeLabel(confirmItem.dueTime)}
            </div>
            <textarea value={noteText} onChange={e => setNoteText(e.target.value)}
              placeholder="Add a note (optional)…"
              style={{
                width: '100%', border: `1px solid ${C.border}`, borderRadius: 8,
                padding: '10px 12px', fontSize: 13, color: C.textPrimary,
                resize: 'none', height: 72, fontFamily: 'inherit',
                boxSizing: 'border-box', outline: 'none',
              }}
            />
            <div style={{ display: 'flex', gap: 10, marginTop: 12 }}>
              <button onClick={() => { setConfirmItem(null); setNoteText(''); }} style={{
                flex: 1, padding: '13px 0', borderRadius: 10, border: `1px solid ${C.border}`,
                background: '#fff', color: C.textSecondary, fontSize: 14, fontWeight: 600, cursor: 'pointer',
              }}>Cancel</button>
              <button onClick={() => markDone(confirmItem.id, noteText)} style={{
                flex: 2, padding: '13px 0', borderRadius: 10, border: 'none',
                background: C.success, color: '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer',
              }}>Confirm done</button>
            </div>
          </div>
        </div>
      )}

      {/* Bulk catch-up sheet */}
      {catchUpOpen && (
        <div style={{
          position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.45)',
          display: 'flex', alignItems: 'flex-end', zIndex: 100,
        }}>
          <div style={{
            background: '#fff', borderRadius: '16px 16px 0 0',
            padding: '20px 20px 32px', width: '100%',
          }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: C.textPrimary, marginBottom: 4 }}>Bulk catch-up</div>
            <div style={{ fontSize: 13, color: C.textSecondary, marginBottom: 14 }}>
              Mark all {overdue.length} overdue items as completed now.
            </div>
            <textarea value={catchUpNote} onChange={e => setCatchUpNote(e.target.value)}
              placeholder="Add a shared note (optional)… e.g. 'carer present, app not used'"
              style={{
                width: '100%', border: `1px solid ${C.border}`, borderRadius: 8,
                padding: '10px 12px', fontSize: 13, color: C.textPrimary,
                resize: 'none', height: 72, fontFamily: 'inherit',
                boxSizing: 'border-box', outline: 'none',
              }}
            />
            <div style={{ display: 'flex', gap: 10, marginTop: 12 }}>
              <button onClick={() => setCatchUpOpen(false)} style={{
                flex: 1, padding: '13px 0', borderRadius: 10, border: `1px solid ${C.border}`,
                background: '#fff', color: C.textSecondary, fontSize: 14, fontWeight: 600, cursor: 'pointer',
              }}>Cancel</button>
              <button onClick={doBulkCatchUp} style={{
                flex: 2, padding: '13px 0', borderRadius: 10, border: 'none',
                background: C.danger, color: '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer',
              }}>Confirm catch-up</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── FEED / FEEDING SESSION RUNNER ──────────────────────────────────────────
function FeedScreen() {
  const [phase, setPhase] = useState('idle'); // idle | active | rest | done
  const [bolusCount, setBolusCount] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [restSecs, setRestSecs] = useState(25 * 60);
  const [notes, setNotes] = useState('');
  const [showAbandon, setShowAbandon] = useState(false);
  const [abandonNote, setAbandonNote] = useState('');
  const [result, setResult] = useState(null);

  const BOLUS_REST = 25 * 60;
  const sessionItem = { name: 'Mid-morning feed', bolusMins: 25 };

  useEffect(() => {
    if (phase !== 'active' && phase !== 'rest') return;
    const id = setInterval(() => {
      if (phase === 'active') setElapsed(e => e + 1);
      if (phase === 'rest') setRestSecs(r => {
        if (r <= 1) { setPhase('active'); return BOLUS_REST; }
        return r - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [phase]);

  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const fmtElapsed = s => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
  };

  const doneWithBolus = () => {
    setBolusCount(b => b + 1);
    setPhase('rest');
    setRestSecs(BOLUS_REST);
  };

  const endSession = () => {
    setResult({ bolus: bolusCount + 1, notes });
    setPhase('done');
  };

  const skipRest = () => {
    setPhase('active');
    setRestSecs(BOLUS_REST);
  };

  const abandonConfirm = () => {
    setResult({ bolus: bolusCount, notes: abandonNote, abandoned: true });
    setPhase('done');
    setShowAbandon(false);
  };

  const restPct = (BOLUS_REST - restSecs) / BOLUS_REST;
  const R = 46; const circ = 2 * Math.PI * R;

  if (phase === 'done' && result) {
    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg }}>
        <div style={{ padding: '16px 16px 12px', borderBottom: `1px solid ${C.border}`, background: '#fff' }}>
          <div style={{ fontSize: 20, fontWeight: 700, color: C.textPrimary }}>Feed</div>
          <div style={{ fontSize: 11, color: C.textMuted, marginTop: 2 }}>Oliver · Mid-morning feed</div>
        </div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24, gap: 16 }}>
          <div style={{ fontSize: 48 }}>{result.abandoned ? '⚠️' : '✅'}</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: C.textPrimary }}>
            {result.abandoned ? 'Session abandoned' : 'Session complete'}
          </div>
          <div style={{ background: '#fff', borderRadius: 12, padding: '16px 20px', border: `1px solid ${C.border}`, width: '100%', display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span style={{ fontSize: 13, color: C.textSecondary }}>Bolus rounds</span>
              <span style={{ fontSize: 13, fontWeight: 700, color: C.textPrimary }}>{result.bolus}</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span style={{ fontSize: 13, color: C.textSecondary }}>Duration</span>
              <span style={{ fontSize: 13, fontWeight: 700, color: C.textPrimary }}>{fmtElapsed(elapsed)}</span>
            </div>
            {result.notes && (
              <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 10 }}>
                <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 3 }}>Note</div>
                <div style={{ fontSize: 13, color: C.textSecondary, fontStyle: 'italic' }}>{result.notes}</div>
              </div>
            )}
          </div>
          <button onClick={() => { setPhase('idle'); setBolusCount(0); setElapsed(0); setNotes(''); setResult(null); }} style={{
            width: '100%', padding: '14px 0', borderRadius: 12, border: 'none',
            background: C.accent, color: '#fff', fontSize: 15, fontWeight: 700, cursor: 'pointer',
          }}>Done</button>
        </div>
      </div>
    );
  }

  if (phase === 'idle') {
    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg }}>
        <div style={{ padding: '16px 16px 12px', borderBottom: `1px solid ${C.border}`, background: '#fff' }}>
          <div style={{ fontSize: 20, fontWeight: 700, color: C.textPrimary }}>Feed</div>
          <div style={{ fontSize: 11, color: C.textMuted, marginTop: 2 }}>Oliver</div>
        </div>
        <div style={{ flex: 1, padding: 16, overflowY: 'auto' }}>
          <div style={{ background: '#fff', borderRadius: 12, padding: 16, border: `1px solid ${C.border}`, marginBottom: 12 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: C.textPrimary, marginBottom: 10 }}>Mid-morning feed</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                <span style={{ fontSize: 12, color: C.textMuted }}>Scheduled</span>
                <span style={{ fontSize: 12, fontWeight: 600, color: C.textPrimary }}>11:30 am</span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                <span style={{ fontSize: 12, color: C.textMuted }}>Rest between boluses</span>
                <span style={{ fontSize: 12, fontWeight: 600, color: C.textPrimary }}>25 min</span>
              </div>
            </div>
          </div>
          <div style={{ background: C.warningBg, borderRadius: 10, padding: '10px 12px', marginBottom: 16, border: `1px solid oklch(88% 0.06 55)` }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.warning }}>⏰ Upcoming in 47 min</div>
            <div style={{ fontSize: 11, color: C.textSecondary, marginTop: 2 }}>Start the session when ready — the timer begins on your first bolus.</div>
          </div>
          <button onClick={() => setPhase('active')} style={{
            width: '100%', padding: '16px 0', borderRadius: 12, border: 'none',
            background: C.accent, color: '#fff', fontSize: 16, fontWeight: 700, cursor: 'pointer',
          }}>Start feeding session</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg }}>
      <div style={{ padding: '16px 16px 12px', borderBottom: `1px solid ${C.border}`, background: '#fff' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 700, color: C.textPrimary }}>Feeding</div>
            <div style={{ fontSize: 11, color: C.textMuted, marginTop: 2 }}>Oliver · {fmtElapsed(elapsed)} elapsed</div>
          </div>
          <button onClick={() => setShowAbandon(true)} style={{
            background: 'none', border: `1px solid ${C.border}`, borderRadius: 8,
            fontSize: 12, color: C.textSecondary, padding: '5px 10px', cursor: 'pointer',
          }}>Abandon</button>
        </div>
      </div>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', padding: '16px 16px 24px', gap: 16, overflowY: 'auto' }}>
        {/* Bolus counter */}
        <div style={{ background: '#fff', borderRadius: 14, padding: '16px 20px', border: `1px solid ${C.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 11, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 2 }}>Bolus rounds</div>
            <div style={{ fontSize: 40, fontWeight: 700, color: C.textPrimary, fontFamily: "'DM Mono', monospace", lineHeight: 1 }}>{bolusCount}</div>
          </div>
          <div style={{ fontSize: 32 }}>🍼</div>
        </div>

        {/* Rest timer / bolus button */}
        {phase === 'rest' ? (
          <div style={{ background: C.accentBg, borderRadius: 14, padding: 20, border: `1px solid oklch(88% 0.06 255)`, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.accent, textTransform: 'uppercase', letterSpacing: '0.06em' }}>Rest period</div>
            <svg width={108} height={108} viewBox="0 0 108 108" style={{ display: 'block' }}>
              <circle cx="54" cy="54" r={R} fill="none" stroke={C.border} strokeWidth="7" />
              <circle cx="54" cy="54" r={R} fill="none" stroke={C.accent} strokeWidth="7"
                strokeDasharray={circ} strokeDashoffset={circ * (1 - restPct)}
                strokeLinecap="round" transform="rotate(-90 54 54)"
                style={{ transition: 'stroke-dashoffset 1s linear' }}
              />
              <text x="54" y="54" textAnchor="middle" dominantBaseline="middle"
                style={{ fontSize: 20, fontWeight: 700, fill: C.textPrimary, fontFamily: "'DM Mono', monospace" }}>
                {fmt(restSecs)}
              </text>
            </svg>
            <button onClick={skipRest} style={{
              background: 'none', border: `1px solid ${C.accent}`, borderRadius: 8,
              fontSize: 12, color: C.accent, padding: '7px 16px', cursor: 'pointer', fontWeight: 600,
            }}>Skip rest ›</button>
          </div>
        ) : (
          <button onClick={doneWithBolus} style={{
            padding: '20px 0', borderRadius: 14, border: 'none',
            background: `linear-gradient(135deg, ${C.accent}, oklch(48% 0.17 265))`,
            color: '#fff', fontSize: 18, fontWeight: 700, cursor: 'pointer',
            boxShadow: `0 4px 16px oklch(52% 0.14 255 / 0.3)`,
          }}>✓ Bolus done — start rest</button>
        )}

        {/* Note field */}
        <div>
          <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.06em' }}>Session note</div>
          <textarea value={notes} onChange={e => setNotes(e.target.value)}
            placeholder="Add a note…"
            style={{
              width: '100%', border: `1px solid ${C.border}`, borderRadius: 8,
              padding: '10px 12px', fontSize: 13, color: C.textPrimary,
              resize: 'none', height: 64, fontFamily: 'inherit',
              boxSizing: 'border-box', outline: 'none', background: '#fff',
            }}
          />
        </div>

        <button onClick={endSession} style={{
          padding: '14px 0', borderRadius: 12, border: `1px solid ${C.border}`,
          background: '#fff', color: C.textSecondary, fontSize: 14, fontWeight: 600, cursor: 'pointer',
        }}>End session</button>
      </div>

      {/* Abandon sheet */}
      {showAbandon && (
        <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.45)', display: 'flex', alignItems: 'flex-end', zIndex: 100 }}>
          <div style={{ background: '#fff', borderRadius: '16px 16px 0 0', padding: '20px 20px 32px', width: '100%' }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: C.textPrimary, marginBottom: 4 }}>Abandon session?</div>
            <div style={{ fontSize: 13, color: C.textSecondary, marginBottom: 14 }}>
              {bolusCount} bolus rounds will be recorded as incomplete.
            </div>
            <textarea value={abandonNote} onChange={e => setAbandonNote(e.target.value)}
              placeholder="Reason for abandoning…"
              style={{
                width: '100%', border: `1px solid ${C.border}`, borderRadius: 8,
                padding: '10px 12px', fontSize: 13, color: C.textPrimary,
                resize: 'none', height: 64, fontFamily: 'inherit',
                boxSizing: 'border-box', outline: 'none',
              }}
            />
            <div style={{ display: 'flex', gap: 10, marginTop: 12 }}>
              <button onClick={() => setShowAbandon(false)} style={{
                flex: 1, padding: '13px 0', borderRadius: 10, border: `1px solid ${C.border}`,
                background: '#fff', color: C.textSecondary, fontSize: 14, fontWeight: 600, cursor: 'pointer',
              }}>Keep going</button>
              <button onClick={abandonConfirm} style={{
                flex: 1, padding: '13px 0', borderRadius: 10, border: 'none',
                background: C.danger, color: '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer',
              }}>Abandon</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ON DUTY ────────────────────────────────────────────────────────────────
function OnDutyScreen({ role }) {
  const isAdmin = role === 'admin';
  const [dutyList, setDutyList] = useState(window.CG.DUTY);
  const [myDuty, setMyDuty] = useState(true);

  const allCarers = window.CG.CARERS;

  const onDutyIds = new Set(dutyList.filter(d => !d.checkedOut).map(d => d.carer.id));
  const offDuty = allCarers.filter(c => !onDutyIds.has(c.id) && c.role !== 'admin');

  const adminCheckOut = (carerId) => {
    setDutyList(prev => prev.map(d =>
      d.carer.id === carerId && !d.checkedOut
        ? { ...d, checkedOut: '10:42' }
        : d));
  };

  const adminCheckIn = (carer) => {
    setDutyList(prev => [...prev, { carer, checkedIn: '10:42', checkedOut: null }]);
  };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg }}>
      <div style={{ padding: '16px 16px 12px', borderBottom: `1px solid ${C.border}`, background: '#fff' }}>
        <div style={{ fontSize: 20, fontWeight: 700, color: C.textPrimary }}>On Duty</div>
        <div style={{ fontSize: 11, color: C.textMuted, marginTop: 2 }}>Oliver · 3 May 2026</div>
      </div>

      <div style={{ flex: 1, padding: 16, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 16 }}>
        {/* My status — for non-admin */}
        {!isAdmin && (
          <div style={{ background: myDuty ? C.successBg : C.bgMuted, borderRadius: 12, padding: '16px', border: `1px solid ${myDuty ? 'oklch(88% 0.06 145)' : C.border}` }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: myDuty ? C.success : C.textSecondary, marginBottom: 8 }}>
              {myDuty ? '● You are on duty' : '○ You are off duty'}
            </div>
            <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 12 }}>
              {myDuty ? `Checked in at 09:15 · You are receiving notifications` : 'Check in to start receiving notifications for Oliver.'}
            </div>
            <button onClick={() => setMyDuty(d => !d)} style={{
              width: '100%', padding: '12px 0', borderRadius: 10, border: 'none',
              background: myDuty ? C.danger : C.success,
              color: '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer',
            }}>{myDuty ? 'Check out' : 'Check in'}</button>
          </div>
        )}

        {/* Currently on duty */}
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 10 }}>
            Currently on duty ({dutyList.filter(d => !d.checkedOut).length})
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {dutyList.filter(d => !d.checkedOut).map(d => (
              <div key={d.carer.id} style={{
                background: '#fff', borderRadius: 10, padding: '11px 12px',
                border: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', gap: 10,
              }}>
                <Avatar carer={d.carer} size={32} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: C.textPrimary }}>
                    {d.carer.name}
                    {d.carer.role === 'admin' && <span style={{ fontSize: 10, color: C.textMuted, fontWeight: 400, marginLeft: 6 }}>Admin</span>}
                  </div>
                  <div style={{ fontSize: 11, color: C.textMuted }}>
                    {d.carer.role === 'admin' ? 'Always on duty' : `Since ${d.checkedIn}`}
                  </div>
                </div>
                {isAdmin && d.carer.role !== 'admin' && (
                  <button onClick={() => adminCheckOut(d.carer.id)} style={{
                    background: 'none', border: `1px solid ${C.border}`, borderRadius: 6,
                    fontSize: 11, color: C.textSecondary, padding: '4px 9px', cursor: 'pointer',
                  }}>Check out</button>
                )}
              </div>
            ))}
          </div>
        </div>

        {/* Off duty */}
        {offDuty.length > 0 && (
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 10 }}>
              Off duty
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {offDuty.map(carer => (
                <div key={carer.id} style={{
                  background: '#fff', borderRadius: 10, padding: '11px 12px',
                  border: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', gap: 10,
                  opacity: 0.7,
                }}>
                  <Avatar carer={carer} size={32} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: C.textPrimary }}>{carer.name}</div>
                    <div style={{ fontSize: 11, color: C.textMuted }}>Off duty</div>
                  </div>
                  {isAdmin && (
                    <button onClick={() => adminCheckIn(carer)} style={{
                      background: C.accentBg, border: `1px solid ${C.accent}`, borderRadius: 6,

                    }}>Check in</button>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── LOG ────────────────────────────────────────────────────────────────────
function LogScreen() {
  const [filter, setFilter] = useState('all');
  const FILTERS = [
    { key: 'all', label: 'All' },
    { key: 'medication_scheduled', label: 'Meds' },
    { key: 'feeding', label: 'Feed' },
    { key: 'activity', label: 'Activity' },
    { key: 'missed', label: 'Missed' },
  ];

  const log = window.CG.LOG;
  const filtered = filter === 'all' ? log
    : filter === 'missed' ? log.filter(e => e.status === 'missed')
    : log.filter(e => e.type === filter);

  const meta = t => TYPE_META[t] || { icon: '•', label: t };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.bg }}>
      <div style={{ padding: '16px 16px 0', background: '#fff', borderBottom: `1px solid ${C.border}` }}>
        <div style={{ fontSize: 20, fontWeight: 700, color: C.textPrimary, marginBottom: 10 }}>Log</div>
        {/* Filters */}
        <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 12 }}>
          {FILTERS.map(f => (
            <button key={f.key} onClick={() => setFilter(f.key)} style={{
              padding: '5px 12px', borderRadius: 20, border: 'none', cursor: 'pointer',
              background: filter === f.key ? C.accent : C.bgMuted,
              color: filter === f.key ? '#fff' : C.textSecondary,
              fontSize: 12, fontWeight: 600, whiteSpace: 'nowrap', flexShrink: 0,
            }}>{f.label}</button>
          ))}
        </div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '12px 12px' }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 8 }}>
          Sunday 3 May 2026
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {filtered.map(entry => {
            const m = meta(entry.type);
            return (
              <div key={entry.id} style={{
                background: entry.status === 'missed' ? C.missedBg : '#fff',
                borderRadius: 10, padding: '11px 12px',
                border: `1px solid ${entry.status === 'missed' ? C.missed + '44' : C.border}`,
              }}>
                <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8 }}>
                  <span style={{ fontSize: 18, lineHeight: 1, marginTop: 1 }}>{m.icon}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                      <span style={{ fontSize: 13, fontWeight: 600, color: C.textPrimary }}>{entry.name}</span>
                      <StatusBadge status={entry.status} />
                      {entry.bulkConfirmed && <Pill label="Bulk" color={C.textMuted} bg={C.bgMuted} />}
                    </div>
                    <div style={{ fontSize: 11, color: C.textMuted, marginTop: 2 }}>
                      {entry.time}
                      {entry.carer && ` · ${entry.carer}`}
                      {entry.bolusRounds != null && ` · ${entry.bolusRounds} bolus rounds`}
                    </div>
                    {entry.notes && (
                      <div style={{ fontSize: 11, color: C.textSecondary, marginTop: 4, fontStyle: 'italic' }}>{entry.notes}</div>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
          {filtered.length === 0 && (
            <div style={{ textAlign: 'center', color: C.textMuted, fontSize: 13, paddingTop: 32 }}>No entries</div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── MOBILE SHELL ───────────────────────────────────────────────────────────

<script type="text/babel">
// care-giver web (desktop) screens
const { useState, useEffect } = React;
const C = window.CG.COLORS;

// ── Shared web components ──────────────────────────────────────────────────
function WebAvatar({ carer, size = 32 }) {

}

function WebPill({ label, color, bg, size = 11 }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center',
      padding: '2px 8px', borderRadius: 20,
      fontSize: size, fontWeight: 600, letterSpacing: '0.04em',
      textTransform: 'uppercase', background: bg, color, whiteSpace: 'nowrap',
    }}>{label}</span>
  );
}

const TYPE_META = {
  medication_scheduled: { icon: '💊', label: 'Medication', color: 'oklch(56% 0.18 280)' },
  as_needed_medication: { icon: '💊', label: 'PRN Med', color: 'oklch(56% 0.18 280)' },
  feeding: { icon: '🍼', label: 'Feed', color: 'oklch(56% 0.18 200)' },
  activity: { icon: '🏃', label: 'Activity', color: 'oklch(56% 0.18 145)' },
  missed: { icon: '⚠️', label: 'Missed', color: C.missed },
};

function WebStatusBadge({ status }) {
  if (status === 'completed') return <WebPill label="Done" color={C.success} bg={C.successBg} />;
  if (status === 'overdue') return <WebPill label="Overdue" color={C.danger} bg={C.dangerBg} />;
  if (status === 'missed') return <WebPill label="Missed" color={C.missed} bg={C.missedBg} />;
  if (status === 'upcoming') return <WebPill label="Upcoming" color={C.textMuted} bg={C.bgMuted} />;

}

// ── Web Sidebar ────────────────────────────────────────────────────────────
function WebSidebar({ section, onSection }) {

        </div>
      </div>

      {/* Nav */}
      <nav style={{ flex: 1, padding: '10px 10px' }}>

          <button key={n.key} onClick={() => onSection(n.key)} style={{

        <div style={{ flex: 1, minWidth: 0 }}>

// ── Web: Today / Dashboard ─────────────────────────────────────────────────
function WebToday() {
  const [items, setItems] = useState(window.CG.TIMELINE);
  const [selected, setSelected] = useState(null);
  const [catchUpOpen, setCatchUpOpen] = useState(false);
  const [catchUpNote, setCatchUpNote] = useState('');
  const [noteText, setNoteText] = useState('');

  const overdue = items.filter(i => i.status === 'overdue');
  const meta = t => TYPE_META[t.type] || { icon: '•', label: t.type };

  const markDone = (id, note = '') => {
    setItems(prev => prev.map(i => i.id === id
      ? { ...i, status: 'completed', carer: 'Sarah M.', notes: note || null }
      : i));
    setSelected(null);
    setNoteText('');
  };

  const doBulkCatchUp = () => {
    setItems(prev => prev.map(i =>
      i.status === 'overdue'
        ? { ...i, status: 'completed', carer: 'Sarah M.', notes: catchUpNote || null, bulkConfirmed: true }
        : i));
    setCatchUpOpen(false);
    setCatchUpNote('');
  };

  const timeLabel = t => {
    const [h, m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'pm' : 'am';
    return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ampm}`;
  };

  return (
    <div style={{ height: '100%', display: 'flex', gap: 0, overflow: 'hidden' }}>
      {/* Main column */}
      <div style={{ flex: 1, overflow: 'auto', padding: '28px 32px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 24 }}>
          <div>
            <h1 style={{ fontSize: 24, fontWeight: 700, color: C.textPrimary, margin: 0 }}>Today</h1>
            <div style={{ fontSize: 13, color: C.textMuted, marginTop: 3 }}>Sunday 3 May 2026 · 10:42 am</div>
          </div>
          {overdue.length > 0 && (
            <button onClick={() => setCatchUpOpen(true)} style={{
              display: 'flex', alignItems: 'center', gap: 6,
              background: C.dangerBg, border: `1px solid oklch(88% 0.06 25)`,
              borderRadius: 8, padding: '8px 14px', cursor: 'pointer',
              color: C.danger, fontSize: 13, fontWeight: 600,
            }}>
              ⚡ Catch up {overdue.length} overdue
            </button>
          )}
        </div>

        {/* Stats row */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginBottom: 28 }}>
          {[
            { label: 'Completed', value: items.filter(i => i.status === 'completed').length, color: C.success, bg: C.successBg },
            { label: 'Overdue', value: overdue.length, color: C.danger, bg: C.dangerBg },
            { label: 'Upcoming', value: items.filter(i => i.status === 'upcoming').length, color: C.accent, bg: C.accentBg },
            { label: 'Total today', value: items.length, color: C.textSecondary, bg: C.bgMuted },
          ].map(s => (
            <div key={s.label} style={{
              background: '#fff', borderRadius: 10, padding: '14px 16px',
              border: `1px solid ${C.border}`,
            }}>
              <div style={{ fontSize: 28, fontWeight: 700, color: s.color, lineHeight: 1, fontFamily: "'DM Mono', monospace" }}>{s.value}</div>
              <div style={{ fontSize: 11, color: C.textMuted, marginTop: 4 }}>{s.label}</div>
            </div>
          ))}
        </div>

        {/* Timeline */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          {items.map(item => {
            const m = meta(item);
            const isOverdue = item.status === 'overdue';
            const isDone = item.status === 'completed';
            return (
              <div key={item.id} onClick={() => !isDone && setSelected(item)} style={{
                background: isOverdue ? C.dangerBg : '#fff',
                borderRadius: 10, padding: '12px 16px',
                border: `1px solid ${isOverdue ? 'oklch(88% 0.06 25)' : C.border}`,
                display: 'flex', alignItems: 'center', gap: 12,
                cursor: isDone ? 'default' : 'pointer',
                opacity: isDone ? 0.7 : 1,
                transition: 'box-shadow 0.15s',
              }}
                onMouseEnter={e => { if (!isDone) e.currentTarget.style.boxShadow = '0 2px 8px oklch(0% 0 0 / 0.06)'; }}
                onMouseLeave={e => { e.currentTarget.style.boxShadow = 'none'; }}
              >
                <span style={{ fontSize: 20 }}>{m.icon}</span>
                <div style={{ width: 72, fontSize: 12, fontWeight: 600, color: isOverdue ? C.danger : C.textMuted, flexShrink: 0, fontFamily: "'DM Mono', monospace" }}>
                  {timeLabel(item.dueTime)}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: C.textPrimary }}>{item.name}</div>
                  {item.notes && <div style={{ fontSize: 12, color: C.textSecondary, marginTop: 2, fontStyle: 'italic' }}>{item.notes}</div>}
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  {item.carer && (
                    <span style={{ fontSize: 12, color: C.textMuted }}>{item.carer}</span>
                  )}
                  <WebStatusBadge status={item.status} />
                  {item.bulkConfirmed && <WebPill label="Bulk" color={C.textMuted} bg={C.bgMuted} />}
                  {!isDone && (
                    <button onClick={e => { e.stopPropagation(); markDone(item.id); }} style={{
                      background: isDone ? C.bgMuted : C.accent, color: '#fff',
                      border: 'none', borderRadius: 6, fontSize: 12, fontWeight: 600,
                      padding: '5px 12px', cursor: 'pointer',
                    }}>Done</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Right panel — duty status */}
      <div style={{ width: 240, borderLeft: `1px solid ${C.border}`, background: '#fff', padding: '28px 20px', overflowY: 'auto' }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 14 }}>
          On Duty Now
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {window.CG.DUTY.filter(d => !d.checkedOut).map(d => (
            <div key={d.carer.id} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <WebAvatar carer={d.carer} size={28} />
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.textPrimary }}>{d.carer.name}</div>
                <div style={{ fontSize: 10, color: C.textMuted }}>
                  {d.carer.role === 'admin' ? 'Admin · Always on duty' : `Since ${d.checkedIn}`}
                </div>
              </div>
            </div>
          ))}
        </div>

        <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 20, paddingTop: 20 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 10 }}>
            Quick log
          </div>
          <div style={{ fontSize: 12, color: C.textSecondary, marginBottom: 10 }}>Log a PRN medication:</div>
          {['Buscopan (PRN)', 'Paracetamol (PRN)'].map(med => (
            <button key={med} style={{
              width: '100%', textAlign: 'left', padding: '8px 10px',
              borderRadius: 7, border: `1px solid ${C.border}`,
              background: C.bgMuted, fontSize: 12, color: C.textPrimary,
              cursor: 'pointer', marginBottom: 6, fontFamily: 'inherit',
            }}>{med}</button>
          ))}
        </div>
      </div>

      {/* Mark done modal */}
      {selected && (
        <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 50 }}>
          <div style={{ background: '#fff', borderRadius: 14, padding: 24, width: 360, boxShadow: '0 8px 32px rgba(0,0,0,0.12)' }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: C.textPrimary, marginBottom: 4 }}>Mark as done</div>
            <div style={{ fontSize: 13, color: C.textSecondary, marginBottom: 16 }}>{selected.name}</div>
            <textarea value={noteText} onChange={e => setNoteText(e.target.value)}
              placeholder="Add a note (optional)…"
              style={{ width: '100%', border: `1px solid ${C.border}`, borderRadius: 8, padding: '10px 12px', fontSize: 13, color: C.textPrimary, resize: 'none', height: 80, fontFamily: 'inherit', boxSizing: 'border-box', outline: 'none' }}
            />
            <div style={{ display: 'flex', gap: 10, marginTop: 12 }}>
              <button onClick={() => { setSelected(null); setNoteText(''); }} style={{ flex: 1, padding: '10px 0', borderRadius: 8, border: `1px solid ${C.border}`, background: '#fff', color: C.textSecondary, fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>Cancel</button>
              <button onClick={() => markDone(selected.id, noteText)} style={{ flex: 2, padding: '10px 0', borderRadius: 8, border: 'none', background: C.success, color: '#fff', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>Confirm done</button>
            </div>
          </div>
        </div>
      )}

      {/* Bulk catch-up */}
      {catchUpOpen && (
        <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 50 }}>
          <div style={{ background: '#fff', borderRadius: 14, padding: 24, width: 400, boxShadow: '0 8px 32px rgba(0,0,0,0.12)' }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: C.textPrimary, marginBottom: 4 }}>Bulk catch-up</div>
            <div style={{ fontSize: 13, color: C.textSecondary, marginBottom: 16 }}>Mark all {overdue.length} overdue items as completed.</div>
            <textarea value={catchUpNote} onChange={e => setCatchUpNote(e.target.value)}
              placeholder="Shared note (optional)… e.g. 'carer present, app not used'"
              style={{ width: '100%', border: `1px solid ${C.border}`, borderRadius: 8, padding: '10px 12px', fontSize: 13, color: C.textPrimary, resize: 'none', height: 80, fontFamily: 'inherit', boxSizing: 'border-box', outline: 'none' }}
            />
            <div style={{ display: 'flex', gap: 10, marginTop: 12 }}>
              <button onClick={() => setCatchUpOpen(false)} style={{ flex: 1, padding: '10px 0', borderRadius: 8, border: `1px solid ${C.border}`, background: '#fff', color: C.textSecondary, fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>Cancel</button>
              <button onClick={doBulkCatchUp} style={{ flex: 2, padding: '10px 0', borderRadius: 8, border: 'none', background: C.danger, color: '#fff', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>Confirm catch-up</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Web: Schedule ──────────────────────────────────────────────────────────
function WebSchedule() {
  const [schedule, setSchedule] = useState(window.CG.SCHEDULE);
  const [showAdd, setShowAdd] = useState(false);
  const [newType, setNewType] = useState('medication_scheduled');
  const [newName, setNewName] = useState('');
  const [newTime, setNewTime] = useState('');
  const [newInterval, setNewInterval] = useState('');
  const [newBolus, setNewBolus] = useState('25');

  const typeLabel = t => ({
    medication_scheduled: 'Medication',
    feeding: 'Feeding',
    activity: 'Activity',
  })[t] || t;

  const handleAdd = () => {
    if (!newName.trim()) return;
    setSchedule(prev => [...prev, {
      id: `s${Date.now()}`, type: newType, name: newName,
      time: newType !== 'feeding' ? newTime : undefined,
      interval: newType === 'feeding' ? parseInt(newInterval) || 210 : undefined,
      bolusMins: newType === 'feeding' ? parseInt(newBolus) || 25 : undefined,
      overdue: 20, missed: 60, compulsory: true,
    }]);
    setShowAdd(false);
    setNewName('');
    setNewTime('');
  };

  const deleteItem = id => setSchedule(prev => prev.filter(s => s.id !== id));

  return (
    <div style={{ height: '100%', overflow: 'auto', padding: '28px 32px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 24 }}>
        <div>
          <h1 style={{ fontSize: 24, fontWeight: 700, color: C.textPrimary, margin: 0 }}>Schedule</h1>
          <div style={{ fontSize: 13, color: C.textMuted, marginTop: 3 }}>Oliver's daily care schedule</div>
        </div>
        <button onClick={() => setShowAdd(true)} style={{
          background: C.accent, color: '#fff', border: 'none', borderRadius: 8,

                <div key={item.id} style={{
                  background: '#fff', borderRadius: 10, padding: '12px 16px',

                      {item.interval && `Every ${item.interval} min`}

              <div style={{ display: 'flex', gap: 8 }}>

                <input type="time" value={newTime} onChange={e => setNewTime(e.target.value)}

// ── Web: Log ───────────────────────────────────────────────────────────────
function WebLog() {
  const [filter, setFilter] = useState('all');
  const FILTERS = [
    { key: 'all', label: 'All events' },
    { key: 'medication_scheduled', label: 'Medications' },
    { key: 'feeding', label: 'Feeding' },
    { key: 'activity', label: 'Activity' },
    { key: 'missed', label: 'Missed only' },
  ];
  const log = window.CG.LOG;
  const filtered = filter === 'all' ? log
    : filter === 'missed' ? log.filter(e => e.status === 'missed')
    : log.filter(e => e.type === filter);

  return (
    <div style={{ height: '100%', overflow: 'auto', padding: '28px 32px' }}>
      <div style={{ marginBottom: 24 }}>

      </div>

      {/* Filters */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 20 }}>
        {FILTERS.map(f => (
          <button key={f.key} onClick={() => setFilter(f.key)} style={{
            padding: '6px 14px', borderRadius: 20, border: 'none', cursor: 'pointer',
            background: filter === f.key ? C.accent : C.bgMuted,
            color: filter === f.key ? '#fff' : C.textSecondary,
            fontSize: 12, fontWeight: 600,
          }}>{f.label}</button>
        ))}
      </div>

      {/* Table */}
      <div style={{ background: '#fff', borderRadius: 12, border: `1px solid ${C.border}`, overflow: 'hidden' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '100px 1fr 120px 120px 160px', padding: '10px 16px', borderBottom: `1px solid ${C.border}`, background: C.bgMuted }}>
          {['Time', 'Event', 'Carer', 'Status', 'Notes'].map(h => (
            <div key={h} style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.06em' }}>{h}</div>
          ))}
        </div>
        {filtered.map((entry, i) => (
          <div key={entry.id} style={{
            display: 'grid', gridTemplateColumns: '100px 1fr 120px 120px 160px',
            padding: '12px 16px',
            borderBottom: i < filtered.length - 1 ? `1px solid ${C.border}` : 'none',
            background: entry.status === 'missed' ? C.missedBg : 'transparent',
            alignItems: 'center',
          }}>
            <div style={{ fontSize: 12, color: C.textMuted, fontFamily: "'DM Mono', monospace" }}>{entry.time}</div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, color: C.textPrimary }}>{entry.name}</div>
              {entry.bolusRounds != null && <div style={{ fontSize: 11, color: C.textMuted }}>{entry.bolusRounds} bolus rounds</div>}
            </div>
            <div style={{ fontSize: 12, color: C.textSecondary }}>{entry.carer || '—'}</div>
            <div><WebStatusBadge status={entry.status} /></div>
            <div style={{ fontSize: 12, color: C.textSecondary, fontStyle: entry.notes ? 'italic' : 'normal' }}>
              {entry.notes || '—'}
              {entry.bulkConfirmed && <WebPill label="Bulk" color={C.textMuted} bg={C.bgMuted} size={10} />}
            </div>
          </div>
        ))}
        {filtered.length === 0 && (
          <div style={{ padding: '32px 16px', textAlign: 'center', color: C.textMuted, fontSize: 13 }}>No entries</div>
        )}
      </div>
    </div>
  );
}

// ── Web: On Duty ───────────────────────────────────────────────────────────
function WebOnDuty() {
  const [dutyList, setDutyList] = useState(window.CG.DUTY);
  const allCarers = window.CG.CARERS;
  const onDutyIds = new Set(dutyList.filter(d => !d.checkedOut).map(d => d.carer.id));
  const offDuty = allCarers.filter(c => !onDutyIds.has(c.id) && c.role !== 'admin');

  const checkOut = id => setDutyList(prev => prev.map(d => d.carer.id === id && !d.checkedOut ? { ...d, checkedOut: '10:42' } : d));
  const checkIn = carer => setDutyList(prev => [...prev, { carer, checkedIn: '10:42', checkedOut: null }]);

  return (
    <div style={{ height: '100%', overflow: 'auto', padding: '28px 32px' }}>
      <div style={{ marginBottom: 24 }}>
        <h1 style={{ fontSize: 24, fontWeight: 700, color: C.textPrimary, margin: 0 }}>On Duty</h1>
        <div style={{ fontSize: 13, color: C.textMuted, marginTop: 3 }}>Current shift status for Oliver's care team</div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 12 }}>
            On duty now ({dutyList.filter(d => !d.checkedOut).length})
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {dutyList.filter(d => !d.checkedOut).map(d => (
              <div key={d.carer.id} style={{ background: C.successBg, borderRadius: 10, padding: '14px 16px', border: `1px solid oklch(88% 0.06 145)`, display: 'flex', alignItems: 'center', gap: 12 }}>
                <WebAvatar carer={d.carer} size={36} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: C.textPrimary }}>{d.carer.name}</div>
                  <div style={{ fontSize: 12, color: C.textMuted }}>
                    {d.carer.role === 'admin' ? 'Admin — always on duty' : `Checked in at ${d.checkedIn}`}
                  </div>
                </div>
                {d.carer.role !== 'admin' && (
                  <button onClick={() => checkOut(d.carer.id)} style={{ border: `1px solid oklch(88% 0.06 25)`, borderRadius: 7, padding: '6px 12px', fontSize: 12, color: C.danger, background: '#fff', cursor: 'pointer', fontWeight: 600 }}>Check out</button>
                )}
              </div>
            ))}
          </div>
        </div>

        <div>
          <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 12 }}>
            Off duty ({offDuty.length})
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {offDuty.map(carer => (
              <div key={carer.id} style={{ background: '#fff', borderRadius: 10, padding: '14px 16px', border: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', gap: 12, opacity: 0.7 }}>
                <WebAvatar carer={carer} size={36} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: C.textPrimary }}>{carer.name}</div>
                  <div style={{ fontSize: 12, color: C.textMuted }}>Off duty</div>
                </div>
                <button onClick={() => checkIn(carer)} style={{ border: `1px solid ${C.accent}`, borderRadius: 7, padding: '6px 12px', fontSize: 12, color: C.accent, background: C.accentBg, cursor: 'pointer', fontWeight: 600 }}>Check in</button>
              </div>
            ))}
            {offDuty.length === 0 && <div style={{ fontSize: 13, color: C.textMuted, padding: '16px 0' }}>All carers are on duty.</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

<script type="text/babel">

const { useState, useEffect } = React;
const C = window.CG.COLORS;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "role": "senior_carer",
  "onDuty": true,
  "mobileTab": "today",
  "showOverdue": true,
  "colorTheme": "warm"
}/*EDITMODE-END*/;

  const [tweaks, setTweakState] = useState(TWEAK_DEFAULTS);
  const setTweak = (key, val) => {
    const update = typeof key === 'object' ? key : { [key]: val };
    setTweakState(prev => {
      const next = { ...prev, ...update };
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: update }, '*');
      return next;
    });
  };

  // Tweaks panel host protocol
  const [showTweaks, setShowTweaks] = useState(false);
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const role = tweaks.role;
  const onDuty = tweaks.onDuty;

          <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.08em' }}>
            iPhone · Mobile app
          </div>
          <IOSDevice width={390} height={844} dark={false}>
            <MobileApp role={role} onDuty={onDuty} />
          </IOSDevice>
        </div>

        {/* ── Web (desktop) column ── */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16, flexShrink: 0 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: 'uppercase', letterSpacing: '0.08em' }}>
            Desktop · Web app
          </div>
          <div style={{
            width: 960, height: 640,
            borderRadius: 12,
            overflow: 'hidden',
            boxShadow: '0 2px 24px oklch(0% 0 0 / 0.12), 0 0 0 1px oklch(88% 0.012 75)',
            background: '#fff',
            flexShrink: 0,
          }}>
            <WebApp role={role} />
          </div>
        </div>
      </div>

      {/* Tweaks panel */}
      {showTweaks && (
        <TweaksPanel onClose={() => {
          setShowTweaks(false);
          window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
        }}>
          <TweakSection title="Viewer">
            <TweakRadio
              label="Role"
              value={tweaks.role}
              options={[
                { value: 'admin', label: 'Admin' },
                { value: 'senior_carer', label: 'Sr. Carer' },
                { value: 'carer', label: 'Carer' },
              ]}
              onChange={v => setTweak('role', v)}
            />
            <TweakToggle
              label="On duty"
              value={tweaks.onDuty}
              onChange={v => setTweak('onDuty', v)}
            />
          </TweakSection>
          <TweakSection title="Timeline">
            <TweakToggle
              label="Show overdue tasks"
              value={tweaks.showOverdue}
              onChange={v => setTweak('showOverdue', v)}
            />
          </TweakSection>
        </TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
